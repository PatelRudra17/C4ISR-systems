version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aegis-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB Time-Series Database
  influxdb:
    image: influxdb:2.7-alpine
    container_name: aegis-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${POSTGRES_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET_GPS}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    networks:
      - aegis-internal
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & PubSub
  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - aegis-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aegis-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aegis-internal

  # Kafka Event Streaming
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aegis-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - aegis-internal

  # FastAPI Application
  aegis-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aegis-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG}
      ENVIRONMENT: ${ENVIRONMENT}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET_GPS: ${INFLUX_BUCKET_GPS}
      INFLUX_BUCKET_SENSOR: ${INFLUX_BUCKET_SENSOR}
      INFLUX_BUCKET_THREAT: ${INFLUX_BUCKET_THREAT}
      INFLUX_BUCKET_CYBER: ${INFLUX_BUCKET_CYBER}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AES_KEY: ${AES_KEY}
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./models:/app/models
      - ./certs:/app/certs
      - ./logs:/var/log/aegis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - aegis-internal
      - aegis-external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: aegis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - aegis-api
    networks:
      - aegis-external
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # InfluxDB Bucket Initialization
  influx-init:
    image: influxdb:2.7-alpine
    container_name: aegis-influx-init
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - aegis-internal
    entrypoint: /bin/sh
    command: >
      -c "
      influx bucket create -n ${INFLUX_BUCKET_SENSOR} -o ${INFLUX_ORG} --host http://influxdb:8086 --token ${INFLUX_TOKEN} || true;
      influx bucket create -n ${INFLUX_BUCKET_THREAT} -o ${INFLUX_ORG} --host http://influxdb:8086 --token ${INFLUX_TOKEN} || true;
      influx bucket create -n ${INFLUX_BUCKET_CYBER} -o ${INFLUX_ORG} --host http://influxdb:8086 --token ${INFLUX_TOKEN} || true;
      echo 'InfluxDB buckets created successfully';
      "
    restart: "no"

volumes:
  postgres-data:
  influx-data:
  redis-data:

networks:
  aegis-internal:
    driver: bridge
    internal: true
  aegis-external:
    driver: bridge
