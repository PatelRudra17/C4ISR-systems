<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Property 1: Confidence color tier mapping</title>
  <style>
    body { font-family: monospace; background: #0a0a0a; color: #ccc; padding: 2rem; }
    h1 { color: #00ffcc; font-size: 1.1rem; }
    .result { margin-top: 1.5rem; font-size: 1.4rem; font-weight: bold; }
    .pass { color: #00ff88; }
    .fail { color: #ff4444; }
    pre { background: #111; padding: 1rem; border-radius: 4px; overflow: auto; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Property 1: Confidence color tier mapping</h1>
  <p>Validates: Requirements 1.2, 1.3, 1.4</p>
  <div id="output"></div>
  <div id="result" class="result"></div>

  <script src="fc-shim.js"></script>
  <script src="../threat-analysis.js"></script>
  <script>
    // Feature: ai-threat-analysis-dashboard, Property 1: Confidence color tier mapping

    const output = document.getElementById('output');
    const resultEl = document.getElementById('result');

    const dashboard = new ThreatDashboard('http://localhost:8000');

    try {
      fc.assert(
        fc.property(
          fc.float({ min: 0.0, max: 1.0, noNaN: true }),
          (score) => {
            const color = dashboard._getConfidenceColor(score);
            // Must be one of the three valid values
            if (!['green', 'amber', 'red'].includes(color)) return false;
            // Must match the correct threshold
            if (score >= 0.85) return color === 'green';
            if (score >= 0.60) return color === 'amber';
            return color === 'red';
          }
        ),
        { numRuns: 200 }
      );

      output.innerHTML = '<pre>200 runs completed.\nAll scores in [0.0, 1.0] produced correct color tier:\n  score >= 0.85 → green\n  score >= 0.60 → amber\n  score < 0.60  → red</pre>';
      resultEl.textContent = '✓ PASS';
      resultEl.className = 'result pass';
    } catch (err) {
      output.innerHTML = '<pre>' + String(err).replace(/</g, '&lt;') + '</pre>';
      resultEl.textContent = '✗ FAIL';
      resultEl.className = 'result fail';
    }
  </script>
</body>
</html>
